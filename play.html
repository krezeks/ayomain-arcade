<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main — ayomain arcade</title>
<style>
  :root{--bg:#101418;--panel:#181e24;--panel2:#1f262e;--line:#2b343d;--ink:#eef3f6;--ink-soft:#9fb0bc;--accent:#ffb020;--accent-ink:#1a1405}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .bar .title{font-weight:900;font-size:1.05rem}
  .bar .lic{font-size:.75rem;font-weight:800;color:var(--accent);border:1px solid #4a3a10;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .bar .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 13px;border-radius:999px;font-weight:700;font-size:.88rem;text-decoration:none;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .frame-wrap{flex:1;position:relative;background:#000}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .missing{max-width:560px;margin:60px auto;text-align:center;color:var(--ink-soft);padding:0 18px}
  .overlay{position:fixed;inset:0;background:rgba(6,8,10,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px}
  .overlay[hidden]{display:none}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:1.05rem}
  .sheet-list{overflow-y:auto;padding:10px}
  .sheet-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:700;color:var(--ink)}
  .sheet-item:hover{background:var(--panel2)}
  .sheet-item .sic{font-size:1.5rem;line-height:1}
  .sheet-item .scat{margin-left:auto;color:var(--ink-soft);font-size:.8rem;font-weight:700}
  .sheet-item[aria-current="true"]{outline:2px solid var(--accent);outline-offset:-2px}
</style>
</head>
<body>
<div class="bar">
  <a class="btn" href="./">← Semua Game</a>
  <span class="title" id="title">Memuat…</span>
  <span class="lic" id="lic"></span>
  <span class="sp"></span>
  <a class="btn" id="direct" href="#" target="_blank" rel="noopener">Buka Langsung ↗</a>
  <button class="btn" id="switchBtn" type="button" aria-haspopup="dialog">⇄ Ganti Game</button>
  <button class="btn btn-accent" id="fs" type="button">⛶ Layar Penuh</button>
</div>
<div class="frame-wrap" id="wrap"></div>
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span id="sheetTitle">Ganti Game</span>
      <button class="btn" id="closeSheet" type="button" aria-label="Tutup daftar game">✕</button>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>
<script src="catalog.js"></script>
<script>
"use strict";
const slug = new URLSearchParams(location.search).get("g");
const game = window.ARCADE_GAMES.find(g => g.slug === slug);
const wrap = document.getElementById("wrap");
const overlay = document.getElementById("overlay");
const switchBtn = document.getElementById("switchBtn");
/* Catat game ini ke "Terakhir Dimainkan" (lokal di browser, tanpa pelacakan). */
function recordRecent(s) {
  try {
    const key = "ayomain.terakhir";
    const prev = JSON.parse(localStorage.getItem(key) || "[]");
    const list = [s].concat(Array.isArray(prev) ? prev.filter(x => x !== s) : []).slice(0, 8);
    localStorage.setItem(key, JSON.stringify(list));
  } catch (e) {}
}
/* Panel Ganti Game: daftar semua game, tanpa balik ke portal. */
let lastFocus = null;
function openSheet() {
  lastFocus = document.activeElement;
  overlay.hidden = false;
  const first = overlay.querySelector(".sheet-item");
  if (first) first.focus();
}
function closeSheet() {
  overlay.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const sheetList = document.getElementById("sheetList");
window.ARCADE_GAMES.forEach(g => {
  const a = document.createElement("a");
  a.className = "sheet-item";
  a.href = "play.html?g=" + encodeURIComponent(g.slug);
  if (game && g.slug === game.slug) a.setAttribute("aria-current", "true");
  a.innerHTML = '<span class="sic" aria-hidden="true">' + g.icon + "</span>" + g.name +
    '<span class="scat">' + g.cat + "</span>";
  sheetList.appendChild(a);
});
switchBtn.addEventListener("click", openSheet);
document.getElementById("closeSheet").addEventListener("click", closeSheet);
overlay.addEventListener("click", ev => { if (ev.target === overlay) closeSheet(); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !overlay.hidden) closeSheet();
});
if (!game) {
  document.getElementById("title").textContent = "Game tidak ditemukan";
  wrap.innerHTML = '<div class="missing"><p>Game ini tidak ada di katalog.</p><p><a class="btn" href="./">← Kembali ke daftar game</a></p></div>';
  document.getElementById("direct").style.display = "none";
  document.getElementById("fs").style.display = "none";
  switchBtn.style.display = "none";
} else {
  recordRecent(game.slug);
  document.title = game.name + " — ayomain arcade";
  document.getElementById("title").textContent = game.icon + " " + game.name;
  document.getElementById("lic").textContent = game.license;
  const url = "games/" + game.slug + "/index.html";
  document.getElementById("direct").href = url;
  const f = document.createElement("iframe");
  f.src = url;
  f.title = game.name;
  f.setAttribute("allow", "fullscreen; autoplay; gamepad");
  f.setAttribute("allowfullscreen", "");
  wrap.appendChild(f);
  document.getElementById("fs").addEventListener("click", () => {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (wrap.requestFullscreen) { wrap.requestFullscreen(); }
  });
}
</script>
</body>
</html>
